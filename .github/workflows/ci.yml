name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # Parity fixtures are committed under test/fixtures (generated by
      # pyparity/gen_fixtures.py against the Python reference package), so the
      # test job needs no Python toolchain.
      - uses: julia-actions/julia-runtest@v1
